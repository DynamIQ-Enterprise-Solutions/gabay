name: gabay
description: "Gabay: the shopper app (main_mobile.dart) and the admin web page (main_admin.dart)."
publish_to: 'none' # private app, never published to pub.dev

# Not stamped by the pre-commit hook (L129): the surfaces' versions live in core/config/app_version.dart
# and changelog.dart. Real build stamps come from --dart-define (APP_VERSION,
# BUILD_NUMBER, GIT_COMMIT, BUILD_TIME; standard 4.8); builds pass --build-name and --build-number.
version: 0.1.0+1

environment:
  sdk: ^3.13.4

# Versions are the Blueprint Part 1 pins; a new package needs a pin first.
dependencies:
  cupertino_icons: ^2.0.0 # iOS icon font, kept so iOS builds find CupertinoIcons (L126)
  dio: 5.11.1
  # E-19: the admin page's sign-in only (main_admin.dart); the shopper app never imports them.
  firebase_auth: 6.7.0
  firebase_core: 4.15.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # OA-4a-1 (E-04 widened by L180: latlong2 is flutter_map's own point type): the admin editor's flat canvas, never tiles.
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  flutter_web_plugins:
    sdk: flutter
  go_router: 18.0.2
  # Caret, not exact: the SDK's flutter_localizations constrains intl itself
  # (EXCEPTIONS E-17).
  intl: ^0.20.3
  latlong2: 0.10.1
  shared_preferences: 2.5.6
  # E-23: the editor's leave-page warning (beforeunload) and, in 4a-4, its file chooser.
  web: 1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n, see l10n.yaml
